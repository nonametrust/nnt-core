name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NNT_TEST_DATABASE_URL: postgres://nnt:nnt@127.0.0.1:5432/nnt_test
      # No NNT_MASTER_KEY here. There used to be an all-zero one, justified as
      # "it encrypts nothing but test fixtures" -- and nothing read it: every
      # suite builds its ring from randomBytes and passes the env in
      # explicitly. A dead all-zero key in a public workflow is a thing people
      # copy, and the README already says none is needed to run the tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nnt
          POSTGRES_PASSWORD: nnt
          POSTGRES_DB: nnt_test
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nnt"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first. The package resolves through dist and has no src fallback,
      # so any package importing @nonametrust/schema fails typecheck and test on
      # a fresh checkout unless dist exists. Deferred in Task 1; closed here.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # "The build emits no test file" was checked by hand until now. The
      # exclusion list in each package's tsconfig is the mechanism; this is
      # the gate on it. Both suffixes vitest collects, not only .test.
      - name: No test file reaches dist
        run: |
          offenders="$(find packages -path '*/node_modules' -prune -o -path '*/dist/*' \( -name '*.test.*' -o -name '*.spec.*' \) -print)"
          if [ -n "$offenders" ]; then
            echo "test files in dist:"
            echo "$offenders"
            exit 1
          fi
