name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # "The build emits no test file" was checked by hand until now. The
      # exclusion list in each package's tsconfig is the mechanism; this is
      # the gate on it.
      - name: No test file reaches dist
        run: |
          offenders="$(find packages -path '*/node_modules' -prune -o -path '*/dist/*' -name '*.test.*' -print)"
          if [ -n "$offenders" ]; then
            echo "test files in dist:"
            echo "$offenders"
            exit 1
          fi
